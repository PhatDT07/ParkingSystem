        let allQuestions = [];
        let wrongIndices = JSON.parse(localStorage.getItem('wrongCAA201')) || [];
        let testBatches = [];
        const QUESTIONS_PER_TEST = 50;
        
        function updateWrongCount() {
            document.getElementById('wrong-count').innerText = wrongIndices.length;
        }

        function saveWrong(index) {
            if (!wrongIndices.includes(index)) {
                wrongIndices.push(index);
                localStorage.setItem('wrongCAA201', JSON.stringify(wrongIndices));
                updateWrongCount();
            }
        }

        function removeWrong(index) {
            wrongIndices = wrongIndices.filter(i => i !== index);
            localStorage.setItem('wrongCAA201', JSON.stringify(wrongIndices));
            updateWrongCount();
        }

        function parseQuestions(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let questions = [];
            let currentQ = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                if (/^[a-fA-F]$/.test(line) && currentQ && currentQ.options.length > 0) {
                    currentQ.answer = line.toUpperCase();
                    currentQ.originalIndex = questions.length;
                    questions.push(currentQ);
                    currentQ = null;
                }
                else if (/^[a-fA-F][.\)]\s/.test(line) || /^[a-fA-F]\.\s?/.test(line)) {
                    if (currentQ) currentQ.options.push(line);
                }
                else {
                    if (currentQ && currentQ.options.length > 0) {
                        currentQ.answer = "Vui lòng xem lại tài liệu";
                        currentQ.originalIndex = questions.length;
                        questions.push(currentQ);
                        currentQ = null;
                    }
                    if (!currentQ) {
                        currentQ = { text: line, options: [], answer: '' };
                    } else if (currentQ.options.length === 0) {
                        currentQ.text += '<br>' + line; 
                    }
                }
            }
            if (currentQ && currentQ.options.length > 0) {
                if(!currentQ.answer) currentQ.answer = "Vui lòng xem lại tài liệu";
                currentQ.originalIndex = questions.length;
                questions.push(currentQ);
            }
            return questions;
        }

        function generateTestBatches() {
            let indices = Array.from({length: allQuestions.length}, (_, i) => i);
            
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            
            testBatches = [];
            for (let i = 0; i < indices.length; i += QUESTIONS_PER_TEST) {
                testBatches.push(indices.slice(i, i + QUESTIONS_PER_TEST));
            }
            
            localStorage.setItem('caa201_testBatches', JSON.stringify(testBatches));
            renderTestMenu();
        }

        function initTestBatches() {
            const saved = localStorage.getItem('caa201_testBatches');
            if (saved) {
                testBatches = JSON.parse(saved);
                const totalInSaved = testBatches.reduce((sum, batch) => sum + batch.length, 0);
                if (totalInSaved !== allQuestions.length) {
                    generateTestBatches(); 
                } else {
                    renderTestMenu();
                }
            } else {
                generateTestBatches();
            }
        }

        function renderTestMenu() {
            const menu = document.getElementById('test-menu');
            menu.innerHTML = '';
            
            testBatches.forEach((batch, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn-small';
                btn.innerText = `Đề ${idx + 1} (${batch.length} câu)`;
                btn.onclick = () => loadTest(idx);
                menu.appendChild(btn);
            });

            const reShuffleBtn = document.createElement('button');
            reShuffleBtn.className = 'btn-small btn-re-shuffle';
            reShuffleBtn.innerText = '🔀 Tạo bộ đề mới';
            reShuffleBtn.onclick = () => {
                if(confirm("Hành động này sẽ xáo trộn lại toàn bộ câu hỏi để tạo 10 đề mới tinh. Bạn có chắc chắn?")) {
                    generateTestBatches();
                    alert("Đã tạo bộ đề mới thành công!");
                }
            };
            menu.appendChild(reShuffleBtn);
        }

        function toggleTestMenu() {
            document.getElementById('test-menu').classList.toggle('show');
        }

        function loadTest(batchIndex) {
            const indices = testBatches[batchIndex];
            let testQList = allQuestions.filter(q => indices.includes(q.originalIndex));
            
            for (let i = testQList.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [testQList[i], testQList[j]] = [testQList[j], testQList[i]];
            }
            
            renderQuiz(testQList, `🎯 Đang thi thử: Đề số ${batchIndex + 1} (${testQList.length} câu)`);
            document.getElementById('test-menu').classList.remove('show');
        }

        function renderQuiz(questions, title) {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            document.getElementById('mode-title').innerText = title;
            window.scrollTo(0, 0);

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-container';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'question-text';
                titleDiv.innerHTML = `Câu ${index + 1}: ${q.text}`;
                card.appendChild(titleDiv);
                
                const ul = document.createElement('ul');
                ul.className = 'options';
                let isAnswered = false;

                q.options.forEach(opt => {
                    const li = document.createElement('li');
                    li.innerHTML = opt;
                    
                    li.onclick = function() {
                        if (isAnswered) return;
                        isAnswered = true;
                        
                        const chosenLetter = opt.charAt(0).toUpperCase();
                        const correctLetter = q.answer.trim();
                        
                        const allLis = ul.querySelectorAll('li');
                        allLis.forEach(item => item.classList.add('disabled'));

                        allLis.forEach(item => {
                            if (item.innerText.charAt(0).toUpperCase() === correctLetter) {
                                item.classList.add('correct');
                            }
                        });

                        if (chosenLetter !== correctLetter) {
                            this.classList.add('wrong');
                            saveWrong(q.originalIndex);
                        } else {
                            removeWrong(q.originalIndex);
                        }
                    };
                    ul.appendChild(li);
                });
                
                card.appendChild(ul);
                container.appendChild(card);
            });
        }

        function showAll() {
            renderQuiz(allQuestions, "📚 Đang hiển thị: Toàn bộ câu hỏi");
            document.getElementById('test-menu').classList.remove('show');
        }

        function showWrongQuestions() {
            if (wrongIndices.length === 0) {
                alert("Tuyệt vời! Bạn chưa có câu hỏi nào làm sai.");
                return;
            }
            const wrongQList = allQuestions.filter(q => wrongIndices.includes(q.originalIndex));
            renderQuiz(wrongQList, `⚠️ Đang hiển thị: ${wrongIndices.length} câu hỏi bạn đã làm sai`);
            document.getElementById('test-menu').classList.remove('show');
